<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#F7F7F3; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#172033" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#FFFFFF" stroke="#E8E8E2" stroke-width="1"/>
  <g transform="translate(48, 16)">
    <rect x="0" y="2" width="28" height="28" rx="6" fill="#5548E0"/>
    <path d="M7 23 L21 23 L14 9 Z" fill="#FFFFFF" opacity="0.9"/>
    <text x="38" y="22" font-size="18" font-weight="700" fill="#191D24">Paper to Prep</text>
    <text x="165" y="22" font-size="12" font-weight="400" fill="#68707D">| D3.js Force-Directed Knowledge Graph</text>
  </g>

  <!-- Main Canvas Container -->
  <g transform="translate(60, 84)">
    
    <!-- Graph Canvas Box (Left: 740px, Right Inspector: 320px) -->
    <rect x="0" y="0" width="740" height="560" rx="12" fill="#FFFFFF" stroke="#E8E8E2" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Canvas Controls Toolbar -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="108" height="28" rx="6" fill="#EEEDFC"/>
      <text x="54" y="18" font-size="11" font-weight="700" fill="#5548E0" text-anchor="middle">Physics: Active</text>
      
      <rect x="116" y="0" width="84" height="28" rx="6" fill="#F2F2ED"/>
      <text x="158" y="18" font-size="11" font-weight="600" fill="#191D24" text-anchor="middle">Reset View</text>
      
      <rect x="208" y="0" width="30" height="28" rx="6" fill="#F2F2ED"/>
      <text x="223" y="19" font-size="13" font-weight="700" fill="#191D24" text-anchor="middle">+</text>
      <rect x="244" y="0" width="30" height="28" rx="6" fill="#F2F2ED"/>
      <text x="259" y="19" font-size="13" font-weight="700" fill="#191D24" text-anchor="middle">−</text>

      <text x="700" y="18" font-size="11" font-weight="600" fill="#68707D" text-anchor="end">Pan &amp; Zoom Enabled · Drag Nodes</text>
    </g>

    <!-- Graph Rendering Area: Edges & Nodes -->
    <g transform="translate(370, 290)">
      <!-- Relational Edges -->
      <line x1="0" y1="0" x2="-140" y2="-100" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="0" y1="0" x2="160" y2="-90" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="0" y1="0" x2="-180" y2="80" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="0" y1="0" x2="150" y2="100" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="150" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="-140" y1="-100" x2="-230" y2="-40" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4"/>
      <line x1="160" y1="-90" x2="230" y2="-20" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Center Master Node (Selected) -->
      <circle cx="0" cy="0" r="38" fill="#5548E0" stroke="#EEEDFC" stroke-width="8"/>
      <text x="0" y="-4" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Residual</text>
      <text x="0" y="10" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Learning</text>

      <!-- Connected Nodes -->
      <!-- Node: Identity Shortcut -->
      <circle cx="-140" cy="-100" r="28" fill="#4338CA"/>
      <text x="-140" y="-3" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Identity</text>
      <text x="-140" y="9" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Shortcut</text>

      <!-- Node: Degradation Bottleneck -->
      <circle cx="160" cy="-90" r="28" fill="#DC2626"/>
      <text x="160" y="-3" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Degradation</text>
      <text x="160" y="9" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Problem</text>

      <!-- Node: ImageNet ILSVRC -->
      <circle cx="-180" cy="80" r="26" fill="#059669"/>
      <text x="-180" y="4" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">ImageNet 3.57%</text>

      <!-- Node: 152-Layer Depth -->
      <circle cx="150" cy="100" r="26" fill="#D97706"/>
      <text x="150" y="4" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">152 Layers</text>

      <!-- Node: Batch Normalization -->
      <circle cx="0" cy="150" r="24" fill="#6366F1"/>
      <text x="0" y="4" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Batch Norm</text>

      <!-- Sub-nodes -->
      <circle cx="-230" cy="-40" r="18" fill="#94A3B8"/>
      <text x="-230" y="3" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">H(x) = F+x</text>

      <circle cx="230" cy="-20" r="18" fill="#94A3B8"/>
      <text x="230" y="3" font-size="7.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">VGG Comp</text>
    </g>

    <!-- Right Side: Node Detail Inspector (320px) -->
    <g transform="translate(760, 0)">
      <rect x="0" y="0" width="320" height="560" rx="12" fill="#FFFFFF" stroke="#E8E8E2" stroke-width="1" filter="url(#shadow)"/>
      
      <g transform="translate(20, 24)">
        <text x="0" y="16" font-size="11" font-weight="700" fill="#5548E0">SELECTED NODE INSPECTOR</text>
        <text x="0" y="42" font-size="18" font-weight="700" fill="#191D24">Residual Learning</text>
        
        <rect x="0" y="56" width="94" height="22" rx="4" fill="#EEEDFC"/>
        <text x="47" y="71" font-size="10.5" font-weight="600" fill="#5548E0" text-anchor="middle">Core Innovation</text>

        <line x1="0" y1="92" x2="280" y2="92" stroke="#E8E8E2"/>

        <text x="0" y="116" font-size="12" font-weight="700" fill="#191D24">Mathematical Formulation:</text>
        <rect x="0" y="126" width="280" height="34" rx="6" fill="#FAF9F5"/>
        <text x="12" y="148" font-size="12" font-family="monospace" font-weight="600" fill="#5548E0">F(x) := H(x) - x</text>

        <text x="0" y="186" font-size="12" font-weight="700" fill="#191D24">Conceptual Takeaway:</text>
        <text x="0" y="206" font-size="12" fill="#4A5568" line-height="18">
          <tspan x="0" dy="0">Rather than learning unreferenced</tspan>
          <tspan x="0" dy="18">underlying functions, layers optimize</tspan>
          <tspan x="0" dy="18">the residual difference relative to input.</tspan>
        </text>

        <text x="0" y="270" font-size="12" font-weight="700" fill="#191D24">Verbatim Manuscript Quote:</text>
        <rect x="0" y="280" width="280" height="74" rx="6" fill="#FAF9F5"/>
        <text x="12" y="302" font-size="11" font-style="italic" fill="#68707D" line-height="16">
          <tspan x="12" dy="0">"We explicitly reformulate the</tspan>
          <tspan x="12" dy="16">layers as learning residual</tspan>
          <tspan x="12" dy="16">functions with reference to inputs."</tspan>
        </text>

        <text x="0" y="386" font-size="12" font-weight="700" fill="#191D24">Connected Clusters (5):</text>
        <g transform="translate(0, 396)">
          <rect x="0" y="0" width="130" height="24" rx="5" fill="#F2F2ED"/>
          <text x="65" y="16" font-size="10.5" fill="#191D24" text-anchor="middle">Identity Shortcut (1st)</text>

          <rect x="140" y="0" width="136" height="24" rx="5" fill="#F2F2ED"/>
          <text x="208" y="16" font-size="10.5" fill="#191D24" text-anchor="middle">Degradation (1st)</text>

          <rect x="0" y="32" width="130" height="24" rx="5" fill="#F2F2ED"/>
          <text x="65" y="48" font-size="10.5" fill="#191D24" text-anchor="middle">ImageNet 3.57% (1st)</text>

          <rect x="140" y="32" width="136" height="24" rx="5" fill="#F2F2ED"/>
          <text x="208" y="48" font-size="10.5" fill="#191D24" text-anchor="middle">152 Layers (1st)</text>
        </g>

        <rect x="0" y="480" width="280" height="36" rx="6" fill="#5548E0"/>
        <text x="140" y="502" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jump to Study Kit Module →</text>
      </g>
    </g>

  </g>
</svg>
